<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma Electoral Integral</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Forzamos que el cuerpo ocupe toda la pantalla real del dispositivo sin scroll exterior */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans flex flex-col h-full">

  <nav class="bg-slate-950 border-b border-slate-800 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-lg shrink-0 z-50">
    <div class="flex items-center gap-3">
      <span class="text-xl">🗳️</span>
      <div>
        <h1 class="text-md font-bold tracking-tight text-white">PLATAFORMA ELECTORAL INTEGRAL</h1>
        <p class="text-[11px] text-slate-400">Portal de Acceso Centralizado Institucional</p>
      </div>
    </div>
    
    <div class="flex flex-wrap gap-2 justify-center">
      <button id="btn-votacion" onclick="cargarApp('votacion')" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-all duration-200">
        📥 Módulo de Votación
      </button>
      <button id="btn-transparencia" onclick="cargarApp('transparencia')" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-all duration-200">
        📊 Resultados en Vivo
      </button>
      <button id="btn-administrador" onclick="cargarApp('administrador')" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-all duration-200">
        ⚙️ Panel Administrador
      </button>
    </div>
  </nav>

  <main class="flex-grow w-full relative bg-slate-950 overflow-hidden">
    <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-40 transition-opacity duration-300">
      <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-sm text-slate-400 font-medium">Cargando entorno seguro de Google Apps Script...</p>
    </div>

    <iframe id="visorApp" class="w-full h-full border-0 block" src="" allow="clipboard-write" onload="ocultarLoader()"></iframe>
  </main>

  <script>
    // =========================================================================
    // CONFIGURACIÓN DE TUS 3 ENLACES INDEPENDIENTES DE GOOGLE APPS SCRIPT
    // (Pega aquí tus URLs reales /exec correspondientes de cada uno)
    // =========================================================================
    const enlacesAppsScript = {
      votacion: "https://script.google.com/macros/s/AKfycbzOw_98KwFfzns8DU7m7XcPPv11dD8BZe4JxIB6cH9VaOxoaPhhnZiixZzJSS7B8lkV/exec",
      transparencia: "https://script.google.com/macros/s/AKfycbwJDj_bz6CMQYCNviafZtnjYldEjsuZqxCfXzylpwCA8FmuiabZhDcXKjSkkmnuHEun/exec",
      administrador: "https://script.google.com/macros/s/AKfycbylpJnZUHSOTceWK7NXaEVSGJFjae3A0GTdMoQqbcgzE4erz-U0j-UJgvcTJbcm9gqWbg/exec"
    };

    function cargarApp(modulo) {
      const iframe = document.getElementById("visorApp");
      const loader = document.getElementById("loader");
      
      // Activar pantalla de carga antes de la transición
      loader.style.opacity = "1";
      loader.style.pointerEvents = "auto";
      
      // Asignar el enlace correspondiente del objeto
      iframe.src = enlacesAppsScript[modulo];
      
      // Actualizar los estilos visuales de los botones en vivo
      const llaves = Object.keys(enlacesAppsScript);
      llaves.forEach(key => {
        const btn = document.getElementById("btn-" + key);
        if (key === modulo) {
          // Botón seleccionado (Estilo destacado en azul/indigo)
          btn.className = "px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider bg-indigo-600 text-white shadow-md transition-all duration-200";
        } else {
          // Botones inactivos (Estilo oscuro integrado)
          btn.className = "px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider bg-slate-800 text-slate-300 transition-all duration-200 hover:bg-slate-700 hover:text-white";
        }
      });
    }

    function ocultarLoader() {
      const loader = document.getElementById("loader");
      loader.style.opacity = "0";
      loader.style.pointerEvents = "none";
    }

    // Inicializar cargando el Módulo de Votación automáticamente en la primera visita
    document.addEventListener("DOMContentLoaded", () => {
      cargarApp('votacion');
    });
  </script>
</body>
</html>
